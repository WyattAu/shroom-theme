name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 26]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node-version }}'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Production dependencies are empty -- everything here is a devDependency,
      # so nothing ships to users. The audit runs anyway to catch a compromised
      # dev dependency early: a malicious postinstall or a poisoned transitive
      # version executes on this runner with access to the repository secrets.
      # Both steps are report-only. Failing CI on a dev-department advisory
      # blocks releases over something users cannot receive.
      - name: Dependency audit (production)
        run: npm audit --omit=dev || true
      - name: Dependency audit (dev, report only)
        run: npm audit || true
      # Fetch the current VS Code colour registry and report any tokens the
      # theme is missing. Report-only: adding tokens requires deriving colours
      # for each variant, which is a design decision rather than a mechanical fix.
      - name: VS Code token coverage audit
        run: node tools/audit-vscode-tokens.js 2>&1 || true

      # apt-get on shared runners hangs periodically -- two consecutive runs sat
      # on this step for over an hour with no output, blocking the matrix, and a
      # later run timed out outright. So: bound it with timeout-minutes, and
      # retry the whole step, since a hung mirror is usually transient rather
      # than persistent. Three attempts at 10 minutes each is 30 minutes of
      # ceiling, which is enough to outlast a stuck mirror without pinning a
      # runner for an hour.
      #
      # `sleep 20` before retrying, because retrying immediately against a
      # mirror that is wedged tends to wedge again.
      - name: Install system dependencies for headless testing
        timeout-minutes: 10
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 libgbm1 libgtk-3-0t64 libnss3 xvfb
      - name: Retry system dependencies (attempt 2)
        timeout-minutes: 10
        if: failure()
        run: |
          sleep 20
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 libgbm1 libgtk-3-0t64 libnss3 xvfb
      - name: Retry system dependencies (attempt 3)
        timeout-minutes: 10
        if: failure()
        run: |
          sleep 40
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 libgbm1 libgtk-3-0t64 libnss3 xvfb

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      # `npm run validate` runs validate-themes, the palette audit, the CVD
      # matrix and the quality profile in sequence. Each is also broken out as
      # its own step below so its output is legible in the log: these tools
      # report every problem at once, which is what you need when fixing a
      # palette, whereas validate-themes fails fast on the first structural
      # error.
      - name: Validate themes (structure + WCAG AA)
        run: node validate-themes.js

      # Alpha-composited contrast and APCA lightness separation.
      - name: Audit palette (alpha-composited contrast + lightness separation)
        run: npm run audit:palette

      # Per-variant CVD collision matrix.
      - name: CVD collision matrix
        run: npm run audit:cvd

      # The eight quality-profile metrics: semantic consistency, visual
      # hierarchy, hue architecture, H-K brightness, chroma budget, colour
      # naming, cross-variant hue, display degradation. Report-only here --
      # the invariants that should fail the build are asserted in the unit
      # tests below. This step exists so the report is regenerated each run.
      - name: Quality profile (8 metrics)
        run: npm run audit:quality

      # Colour science and palette tests. These need no VS Code host and no
      # display, so they run as plain mocha and stay fast.
      - name: Unit tests (color science, palette, quality profile)
        run: npm run test:unit

      - name: Test (VS Code host)
        run: xvfb-run -a npm test

      - name: Convert themes to multi-editor formats
        run: npm run convert

      - name: Validate converted themes
        run: |
          for f in exports/tmTheme/*.tmTheme; do
            if [ ! -f "$f" ] || ! grep -q '<?xml' "$f"; then
              echo "Invalid tmTheme: $f"
              exit 1
            fi
          done
          for f in exports/jetbrains/*.icls; do
            if [ ! -f "$f" ] || ! grep -q '<scheme' "$f"; then
              echo "Invalid JetBrains scheme: $f"
              exit 1
            fi
          done
          for f in exports/vim/*.vim; do
            if [ ! -f "$f" ] || ! grep -q 'set background' "$f"; then
              echo "Invalid Vim scheme: $f"
              exit 1
            fi
          done
          for f in exports/windows-terminal/*.json; do
            if [ ! -f "$f" ] || ! python3 -c "import json; json.load(open('$f'))"; then
              echo "Invalid Windows Terminal scheme: $f"
              exit 1
            fi
          done
          for f in exports/iterm2/*.itermcolors; do
            if [ ! -f "$f" ] || ! grep -q '<?xml' "$f"; then
              echo "Invalid iTerm2 scheme: $f"
              exit 1
            fi
          done
          for f in exports/warp/*.yaml; do
            if [ ! -f "$f" ] || ! grep -q 'background:' "$f"; then
              echo "Invalid Warp scheme: $f"
              exit 1
            fi
          done
          for f in exports/alacritty/*.toml; do
            if [ ! -f "$f" ] || ! grep -q '\[colors.primary\]' "$f"; then
              echo "Invalid Alacritty scheme: $f"
              exit 1
            fi
          done
          for f in exports/kitty/*.conf; do
            if [ ! -f "$f" ] || ! grep -q '^background ' "$f"; then
              echo "Invalid Kitty scheme: $f"
              exit 1
            fi
          done
          for f in exports/css/*.css; do
            if [ ! -f "$f" ] || ! grep -q ':root' "$f"; then
              echo "Invalid CSS export: $f"
              exit 1
            fi
          done
          echo "All converted themes validated"

      - name: Generate SBOM
        run: npm run sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-node-${{ matrix.node-version }}
          path: reports/sbom.spdx.json

      # Visual regression testing
      - name: Download previous visual baseline
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: visual-references
          path: tests/visual/baseline

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Visual regression tests
        run: npm run test:visual

      - name: Upload visual references (for next run)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-references
          path: tests/visual/references/

      - name: Upload contrast reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contrast-reports
          path: reports/

      - name: Upload converted themes
        uses: actions/upload-artifact@v4
        with:
          name: converted-themes-node-${{ matrix.node-version }}
          path: exports/

      - name: Upload visual regression diffs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-diffs
          path: tests/visual/diffs/

  # Build the WASM previewer and fail if the committed artifact is stale.
  #
  # This exists because the previewer embeds theme JSON at compile time via
  # include_str!, so every palette change makes docs/previewer/ wrong. That
  # happened once and was only found by loading the page in a browser.
  #
  # trunk is installed from the release tarball rather than `cargo install`:
  # cargo install trunk fails on libdeflate-sys, which needs GCC's
  # no-evex512 target attribute (dropped in GCC 16) and does not compile under
  # clang either. The prebuilt binary avoids both.
  previewer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            previewer/target
          key: trunk-${{ runner.os }}-${{ hashFiles('previewer/Cargo.lock') }}

      - name: Install trunk (release tarball)
        run: |
          if command -v trunk >/dev/null 2>&1; then
            echo "trunk already cached: $(trunk --version)"
          else
            mkdir -p "$HOME/.local/bin"
            gh release download v0.21.14 --repo trunk-rs/trunk \
              --pattern "trunk-x86_64-unknown-linux-gnu.tar.gz" --dir /tmp --clobber
            tar xzf /tmp/trunk-x86_64-unknown-linux-gnu.tar.gz -C /tmp
            install -m 0755 /tmp/trunk "$HOME/.local/bin/trunk"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            trunk --version
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build previewer
        working-directory: previewer
        run: trunk build --release

      # Byte-comparing the artifact does not work: trunk's content hash changes
      # with the toolchain, so a CI build never matches a local one byte for
      # byte. The invariant that matters is narrower -- the artifact was built
      # from the current themes. A digest of the theme JSON over the build
      # captures that, and is stable across environments.
      #
      # The digest is committed next to the artifact and refreshed whenever the
      # previewer is rebuilt. A mismatch means the themes moved and the
      # previewer was not rebuilt.
      - name: Check the previewer was built from the current themes
        working-directory: previewer
        run: |
          current=$(cat ../themes/*.json | sha256sum | cut -d' ' -f1)
          recorded=$(cat ../docs/previewer/theme-digest 2>/dev/null || echo MISSING)
          echo "themes digest:  $current"
          echo "recorded:       $recorded"
          if [ "$current" != "$recorded" ]; then
            echo ""
            echo "STALE: docs/previewer/ was built from a different palette."
            echo ""
            echo "Refresh it with:"
            echo "  (cd previewer && trunk build --release)"
            echo "  cp dist/index.html dist/*.js dist/*_bg.wasm ../docs/previewer/"
            echo "  cat ../themes/*.json | sha256sum | cut -d' ' -f1 \\"
            echo "    > ../docs/previewer/theme-digest"
            exit 1
          fi

  # Publish job - only on version tags, depends on test passing
  publish:
    needs: [test, previewer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Validate themes
        run: npm run validate

      - name: Convert themes
        run: npm run convert

      - name: Package extension
        run: npx vsce package --no-dependencies

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --no-dependencies || echo "Publish skipped (version may already exist)"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.vsix
            exports/tmTheme/*.tmTheme
            exports/jetbrains/*.icls
            exports/vim/*.vim
            exports/windows-terminal/*.json
            exports/css/*.css
          body_path: CHANGELOG.md
