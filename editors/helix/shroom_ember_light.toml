# Shroom Ember Light for Helix
# Generated from VS Code theme. Do not edit manually.
# Install: copy to ~/.config/helix/themes/shroom_ember_light.toml

[palette]
bg = "#F4EEE4"
fg = "#464656"
bg_dark = "#E1DECC"
bg_light = "#EBE8DD"
bg_highlight = "#EBE8DD"
selection = "#D9D4C3"
cursor_line = "#EBE8DD"
line_number = "#464656"
line_number_active = "#464656"
accent = "#8C8696"
comment = "#796A5F"
keyword = "#8E395E"
string = "#4E4F18"
number = "#8F5F1E"
constant = "#8F5F1E"
variable = "#97433E"
func = "#2B4D2F"
type = "#794324"
class = "#794324"
namespace = "#4A4555"
operator = "#8E395E"
punctuation = "#4A4555"
regexp = "#8F5F1E"
tag = "#8E395E"
attribute = "#4A4555"
decorator = "#97433E"
purple = "#8E395E"
teal = "#2B4D2F"
green = "#4E4F18"
amber = "#8F5F1E"
red = "#A14647"
blue = "#97433E"
muted = "#796A5F"
error = "#A14647"
warning = "#8F5F1E"
info = "#2B4D2F"

[ui]
background = "bg"
foreground = "fg"
cursorline = "cursor_line"
color-columns = "bg_light"

[ui.cursor]
foreground = "bg"
background = "fg"

[ui.cursor.primary]
foreground = "bg"
background = "cursor"

[ui.cursor.match]
foreground = "purple"

[ui.linenr]
foreground = "line_number"

[ui.linenr.selected]
foreground = "line_number_active"

[ui.statusline]
foreground = "fg"
background = "bg_dark"

[ui.statusline.inactive]
foreground = "muted"
background = "bg_darker"

[ui.statusline.normal]
foreground = "bg"
background = "purple"

[ui.statusline.insert]
foreground = "bg"
background = "teal"

[ui.statusline.select]
foreground = "bg"
background = "amber"

[ui.popup]
foreground = "fg"
background = "bg_light"

[ui.window]
foreground = "accent"

[ui.help]
foreground = "fg"
background = "bg_light"

[ui.text]
foreground = "fg"

[ui.text.focus]
foreground = "purple"

[ui.text.inactive]
foreground = "muted"

[ui.text.info]
foreground = "teal"

[ui.virtual]
foreground = "muted"

[ui.virtual.ruler]
foreground = "bg_highlight"

[ui.virtual.whitespace]
foreground = "muted"

[ui.virtual.indent-guide]
foreground = "muted"

[ui.virtual.inlay-hint]
foreground = "muted"
italic = true

[ui.selection]
background = "selection"

[ui.cursorline.primary]
background = "cursor_line"

[ui.bufferline]
foreground = "muted"
background = "bg_dark"

[ui.bufferline.active]
foreground = "fg"
background = "bg"

[syntax]
"type" = "type"
"type.builtin" = "amber"
"type.enum" = "type"
"type.enum.variant" = "amber"
"constructor" = "amber"
"constant" = "constant"
"constant.builtin" = "amber"
"constant.builtin.boolean" = "constant"
"constant.character" = "string"
"constant.character.escape" = "amber"
"constant.numeric" = "number"
"constant.numeric.integer" = "number"
"constant.numeric.float" = "number"
"string" = "string"
"string.regexp" = "regexp"
"string.special" = "amber"
"string.special.path" = "blue"
"string.special.url" = "blue"
"string.special.symbol" = "amber"
"comment" = "comment"
"comment.line" = "comment"
"comment.block" = "comment"
"comment.block.documentation" = "comment"
"variable" = "variable"
"variable.builtin" = "constant"
"variable.parameter" = "blue"
"variable.other" = "fg"
"variable.other.member" = "fg"
"label" = "blue"
"punctuation" = "punctuation"
"punctuation.delimiter" = "punctuation"
"punctuation.bracket" = "punctuation"
"punctuation.special" = "amber"
"keyword" = "keyword"
"keyword.control" = "keyword"
"keyword.control.conditional" = "keyword"
"keyword.control.repeat" = "keyword"
"keyword.control.import" = "keyword"
"keyword.control.return" = "keyword"
"keyword.control.exception" = "keyword"
"keyword.operator" = "operator"
"keyword.directive" = "keyword"
"keyword.storage" = "keyword"
"keyword.storage.type" = "keyword"
"keyword.storage.modifier" = "keyword"
"operator" = "operator"
"function" = "func"
"function.builtin" = "teal"
"function.method" = "func"
"function.macro" = "keyword"
"function.special" = "amber"
"tag" = "tag"
"tag.attribute" = "attribute"
"tag.delimiter" = "punctuation"
"namespace" = "namespace"
"module" = "namespace"
"special" = "amber"
"attribute" = "decorator"

[marker]
error = "error"
warning = "warning"
info = "info"
hint = "teal"

[diagnostic]
error = { fg = "error", underline-style = "curl" }
warning = { fg = "warning", underline-style = "curl" }
info = { fg = "info", underline-style = "curl" }
hint = { fg = "teal", underline-style = "curl" }
